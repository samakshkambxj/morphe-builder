# Release pipeline: fetch -> patch -> sign -> module -> QA gate ->
# vendor-drop -> GitHub release. From-source throughout: stock bases from
# APKMirror pins, Morphe CLI + patches at pinned revs, our own key.
# This workflow owns the whole chain; see config.toml for pins.
name: build

# Release publishing needs contents:write (default token is read-only).
permissions:
  contents: write

on:
  schedule:
    - cron: "0 16 * * *" # daily: detect drift, build only unreleased pins
  push:
    paths: [config.toml, scripts/**, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      channel:
        description: "stable (pinned) or beta (floating)"
        default: "stable"
        type: choice
        options: [stable, beta]
      force_build:
        description: "build even when no upstream change is detected"
        default: false
        type: boolean

jobs:
  detect:
    # Hermetic stable: the matrix builds only pins absent from our last
    # release manifest. Live drift is reported (promotion signal), never
    # rebuilt blindly. Pin bumps via push build immediately.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      updates: ${{ steps.check.outputs.updates }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: python3 scripts/check-updates.py

      - name: Summary
        run: |
          echo "build=${{ steps.check.outputs.build }} updates=${{ steps.check.outputs.updates }}" >> "$GITHUB_STEP_SUMMARY"

  patch:
    needs: [detect]
    if: needs.detect.outputs.build == 'true' || inputs.channel == 'beta'
    strategy:
      fail-fast: true
      matrix:
        app: [youtube, music, reddit]
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx10g # YouTube patching is heap-hungry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android build-tools (apksigner)
        run: |
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" >/dev/null
          echo "/opt/android-sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Resolve config for app
        run: |
          python3 - <<'EOF'
          import os, tomllib
          cfg = tomllib.load(open("config.toml", "rb"))
          key = {"youtube": "youtube", "music": "music", "reddit": "reddit"}[os.environ["MATRIX_APP"]]
          a = cfg["apps"][key]
          src = cfg["sources"][a.get("source", "morphe")]
          out = {
              "STOCK_URL": a["apkmirror"],
              "STOCK_MATCH": {"youtube": "youtube-morphe-module-", "music": "music-morphe-module-", "reddit": "reddit-morphe-module-"}[os.environ["MATRIX_APP"]],
              "APP_PACKAGE": a["package"],
              "APP_BASE": a["base"],
              "APP_MARKERS": a.get("markers", "app/morphe"),
              "CLI_REV": src["cli_rev"],
              "PATCHES_REV": src["patches_rev"],
          }
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          print(out)
          EOF
        env:
          MATRIX_APP: ${{ matrix.app }}

      - name: Keystore from secret (else ephemeral + warning)
        run: |
          if [ -n "${{ secrets.MORPHE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MORPHE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            echo "MORPHE_KEYSTORE=$PWD/keystore.jks" >> "$GITHUB_ENV"
            echo "MORPHE_STOREPASS=${{ secrets.MORPHE_STOREPASS }}" >> "$GITHUB_ENV"
            echo "MORPHE_KEYPASS=${{ secrets.MORPHE_KEYPASS }}" >> "$GITHUB_ENV"
          else
            echo "no keystore secret: patch-app.sh generates an ephemeral key (PR builds only)"
          fi

      - name: "Resolve floating revs (beta: latest dev patches)"
        if: inputs.channel == 'beta'
        run: |
          REV=$(curl -fsSL "https://api.github.com/repos/MorpheApp/morphe-patches/releases?per_page=5" \
            | python3 -c "import json,sys; rs=json.load(sys.stdin); print(next(r['tag_name'] for r in rs if not r.get('draft')))")
          echo "PATCHES_REV=$REV" >> "$GITHUB_ENV"
          echo "floating patches: $REV (CLI stays pinned for tooling stability)"

      - name: "Fetch stock base (stable: pinned APKMirror)"
        if: inputs.channel != 'beta'
        run: python3 scripts/fetch-stock.py --release "$STOCK_URL" --match "$STOCK_MATCH" --out "stock-${{ matrix.app }}.apk"

      - name: "Fetch stock base (beta: newest module)"
        if: inputs.channel == 'beta'
        run: |
          bash scripts/fetch-module.sh --app "${{ matrix.app }}" --out upstream/ 2>&1 | tee fetch.log
          python3 scripts/extract-stock.py --module "upstream/${{ matrix.app }}-module.zip" --out "stock-${{ matrix.app }}.apk"
          echo "APP_BASE=$(grep ^BASE_VERSION= fetch.log | cut -d= -f2)" >> "$GITHUB_ENV"

      # From-source patching: stock base + pinned CLI/patches, root recipe.
      - name: Patch + sign
        run: |
          bash scripts/patch-app.sh --app "${{ matrix.app }}" \
            --stock "stock-${{ matrix.app }}.apk" --out "patched-${{ matrix.app }}.apk" \
            --workdir "work-${{ matrix.app }}" \
            --cli-rev "$CLI_REV" --patches-rev "$PATCHES_REV"

      - name: Assemble module
        run: |
          bash scripts/make-module.sh --app "${{ matrix.app }}" \
            --package "$APP_PACKAGE" --version "$APP_BASE" \
            --patched "patched-${{ matrix.app }}.apk" --stock "stock-${{ matrix.app }}.apk" \
            --out "modules/${{ matrix.app }}-module.zip"

      - name: QA gate
        run: |
          bash scripts/qa-gate.sh --module "modules/${{ matrix.app }}-module.zip" \
            --markers "$APP_MARKERS" --min-stock-libs 10

      - name: Record build provenance
        run: |
          printf 'APP_BASE=%s\nPATCHES_REV=%s\n' "$APP_BASE" "$PATCHES_REV" \
            > "build-info-${{ matrix.app }}.env"
          cat "build-info-${{ matrix.app }}.env"
          mkdir -p drop
          cp "modules/${{ matrix.app }}-module.zip" "build-info-${{ matrix.app }}.env" drop/

      - uses: actions/upload-artifact@v4
        with:
          # Single staged dir -> flat artifact root. (Multi-path uploads
          # preserve directory structure, which previously nested the zips
          # under modules/modules/ on download.)
          name: module-${{ matrix.app }}
          path: drop/

  release:
    needs: [patch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: modules/
          merge-multiple: true

      - name: Assemble vendor-drop
        run: |
          TAG="$(date -u +%Y%m%d)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Provenance recorded per app at build time (pins and floats alike).
          # Artifacts download flat into modules/, so read them there.
          source modules/build-info-youtube.env; YT_BASE=$APP_BASE; PATCH_REV=$PATCHES_REV
          source modules/build-info-music.env; MU_BASE=$APP_BASE
          source modules/build-info-reddit.env; RD_BASE=$APP_BASE
          echo "bases: YT=$YT_BASE music=$MU_BASE reddit=$RD_BASE rev=$PATCH_REV"
          bash scripts/make-vendor-drop.sh --out vendor-drop --tag "$TAG" \
            --patch-rev "$PATCH_REV" \
            --app YouTube --module "modules/youtube-module.zip" --base-version "$YT_BASE" \
            --app Music   --module "modules/music-module.zip"   --base-version "$MU_BASE" \
            --app Reddit  --module "modules/reddit-module.zip"  --base-version "$RD_BASE" \
            --split

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Files only: gh cannot upload directories, and lib sets are
          # re-extracted from the modules downstream anyway.
          gh release create "$TAG" --title "$TAG (${{ inputs.channel || 'stable' }})" \
            --notes "Patch revs see config.toml pins. versions.json is authoritative." \
            modules/*-module.zip vendor-drop/*.apk vendor-drop/*.apk.part* \
            vendor-drop/versions.json vendor-drop/SHA256SUMS
